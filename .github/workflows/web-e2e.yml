name: Web e2e

on:
  push:
    paths:
      - "web/**"
      - "src/**"
      - ".github/workflows/web-e2e.yml"
  pull_request:
    paths:
      - "web/**"
      - "src/**"
      - ".github/workflows/web-e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: freito_dev
          MYSQL_DATABASE: freito_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -pfreito_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ConnectionStrings__Default: "Server=127.0.0.1;Port=3306;Database=freito_dev;User=root;Password=freito_dev;AllowPublicKeyRetrieval=True;"
      Jwt__Key: "ci-only-jwt-signing-key-not-for-production-use-change-me-32bytes+"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://localhost:5025"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Apply database migrations
        run: >-
          dotnet ef database update
          --project src/Freito.Infrastructure
          --startup-project src/Freito.Api

      - name: dotnet test
        run: dotnet test src/Freito.slnx

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Start API
        run: |
          (dotnet run --project src/Freito.Api --no-launch-profile > /tmp/api.log 2>&1 < /dev/null &)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5025/api/health; then
              echo "API is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become healthy. Logs:" >&2
          cat /tmp/api.log >&2
          exit 1

      - name: Run e2e tests
        working-directory: web
        run: npm run e2e

      - name: Dump API logs on failure
        if: failure()
        run: |
          echo "=== API LOGS ==="
          cat /tmp/api.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
