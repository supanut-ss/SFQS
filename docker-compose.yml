services:
  mysql:
    image: mysql:8.4
    container_name: freito-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: freito_dev
      MYSQL_DATABASE: freito_dev
    ports:
      - "3306:3306"
    volumes:
      - freito-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pfreito_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  freito-mysql-data:
